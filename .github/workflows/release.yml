# Baut ein ZIP und legt damit ein GitHub-Release an.
# Start: auf GitHub unter Actions -> Release -> "Run workflow", Version eingeben (z. B. v1.0.1),
# oder automatisch beim Push eines Tags wie v1.0.0.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Versionsnummer, z. B. v1.0.0"
        required: true
        default: "v1.0.0"
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ github.event.inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: launcher/go.mod

      # Startprogramm ACCDCServer.exe fuer Windows bauen
      - name: ACCDCServer.exe bauen
        working-directory: launcher
        run: GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "-s -w" -o ../ACCDCServer.exe .

      # Dateien liegen im ZIP direkt oben, damit beim Entpacken kein doppelter Ordner entsteht.
      # .gitattributes sorgt beim Checkout fuer Windows-Zeilenenden in .ps1, .bat und .json.
      - name: ZIP bauen
        run: |
          name="ACCDCServer-${VERSION}"
          zip -r -X "${name}.zip" . -x ".git/*" ".github/*" ".gitignore" ".gitattributes" "launcher/*"
          unzip -l "${name}.zip"

      - name: Release anlegen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$VERSION" "ACCDCServer-${VERSION}.zip" \
            --target "$GITHUB_SHA" \
            --title "ACCDCServer $VERSION" \
            --notes-file .github/release-notes.md
